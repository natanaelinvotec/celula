<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pré-cadastro · Célula Diagnósticos</title>
<meta name="robots" content="noindex">
<link rel="icon" href="img/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="css/app.css">
<style>
  .pre{min-height:100vh;display:grid;place-items:center;padding:20px 16px}
  .pre .box{width:100%;max-width:440px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:26px 24px;display:flex;flex-direction:column;gap:12px}
  .pre img{height:44px;align-self:center}
  .pre h1{margin:4px 0 0;text-align:center;font-size:1.3rem}
  .pre .num{align-self:center;background:var(--blue-50);color:var(--blue-d);border-radius:999px;padding:4px 14px;font-weight:900}
  .pre .f{display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .pre .lgpd{display:flex;gap:10px;align-items:flex-start;font-size:.82rem;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:600;line-height:1.35}
  .pre .lgpd input{margin-top:3px;width:18px;height:18px}
  .pre .ok{text-align:center;padding:20px 0}
  .pre .ok b{display:block;font-size:1.4rem;color:var(--ok);margin-bottom:8px}
  .pre .err{background:var(--red-50);color:var(--red);border-radius:12px;padding:10px 12px;font-weight:700}
</style>
</head>
<body>
<main class="pre">
  <form class="box" id="f" novalidate>
    <img src="img/logo-celula.png" alt="Célula Diagnósticos">
    <h1>Pré-cadastro para a coleta</h1>
    <span class="num" id="num" hidden></span>
    <p class="note" style="text-align:center;margin:0">Preencha antes de chegar e reduza seu tempo com a atendente. Leva menos de 1 minuto.</p>
    <div class="err" id="err" hidden></div>
    <div id="campos" style="display:contents">
      <label class="f">Nome completo<input class="in" id="nome" autocomplete="name" required minlength="3" maxlength="120"></label>
      <label class="f">CPF<input class="in" id="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" required></label>
      <label class="f">Data de nascimento<input class="in" id="nasc" type="date" required></label>
      <label class="f">Celular (WhatsApp)<input class="in" id="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="(67) 99999-9999" required></label>
      <label class="lgpd"><input type="checkbox" id="lgpd" required><span>Autorizo a Célula Diagnósticos a usar estes dados exclusivamente para o meu cadastro e atendimento, conforme a LGPD (Lei 13.709/2018). Eles não são compartilhados com terceiros.</span></label>
      <button class="btn blue" id="btn" type="submit" style="justify-content:center">Enviar pré-cadastro</button>
    </div>
    <div class="ok" id="ok" hidden><b>Pré-cadastro recebido!</b>Quando chegar à unidade, informe seu nome ou o número do orçamento. Até já!</div>
    <p class="note" style="text-align:center;margin:0;font-size:.75rem">Central de Atendimento (67) 99212-2801 · @celula.ms</p>
  </form>
</main>
<script type="module">
import { db } from './js/firebase.js';
import { doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js';
const $ = id => document.getElementById(id); const q = new URLSearchParams(location.search);
const o = q.get('o'), t = q.get('t'), n = q.get('n');
if (n && /^\d+$/.test(n)) { $('num').textContent = 'Orçamento #' + n.padStart(5, '0'); $('num').hidden = false; }
const erro = m => { $('err').textContent = m; $('err').hidden = !m; };
if (!o || !t) { erro('Link incompleto. Use o QR code ou o link que está no seu orçamento em PDF.'); $('campos').style.display = 'none'; }
// máscaras
$('cpf').addEventListener('input', e => { const d = e.target.value.replace(/\D/g, '').slice(0, 11); e.target.value = d.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2'); });
$('tel').addEventListener('input', e => { const d = e.target.value.replace(/\D/g, '').slice(0, 11); e.target.value = d.length > 6 ? d.replace(/(\d{2})(\d{4,5})(\d{0,4})/, '($1) $2-$3') : d.length > 2 ? d.replace(/(\d{2})(\d*)/, '($1) $2') : d; });
function cpfValido(c) { if (!/^\d{11}$/.test(c) || /^(\d)\1+$/.test(c)) return false; const dv = (n) => { let s = 0; for (let i = 0; i < n; i++) s += +c[i] * (n + 1 - i); const r = (s * 10) % 11; return (r === 10 ? 0 : r) === +c[n]; }; return dv(9) && dv(10); }
$('f').addEventListener('submit', async e => {
  e.preventDefault(); erro('');
  const nome = $('nome').value.trim().replace(/\s+/g, ' '), cpf = $('cpf').value.replace(/\D/g, ''), nasc = $('nasc').value, tel = $('tel').value.replace(/\D/g, '');
  if (nome.length < 3) return erro('Digite seu nome completo.');
  if (!cpfValido(cpf)) return erro('CPF inválido — confira os números.');
  if (!nasc || nasc > new Date().toISOString().slice(0, 10)) return erro('Informe a data de nascimento.');
  if (tel.length < 10) return erro('Informe o celular com DDD.');
  if (!$('lgpd').checked) return erro('É preciso autorizar o uso dos dados para continuar.');
  $('btn').disabled = true; $('btn').innerHTML = '<span class="spin"></span> Enviando…';
  try {
    await setDoc(doc(db, 'precadastros', o), { token: t, nome, cpf, nascimento: nasc, telefone: tel, lgpd: true, enviadoEm: serverTimestamp(), orcamentoNumero: n && /^\d+$/.test(n) ? Number(n) : null, visto: false });
    $('campos').style.display = 'none'; $('ok').hidden = false;
  } catch (err) { erro(/permission/i.test(err.message) ? 'Este link não confere com o orçamento. Use o QR code ou o link do seu PDF.' : 'Não foi possível enviar agora. Tente de novo em instantes.'); $('btn').disabled = false; $('btn').textContent = 'Enviar pré-cadastro'; }
});
</script>
</body>
</html>
