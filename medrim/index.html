<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>MedRim · Baterias Hiperrim</title>
<meta name="description" content="Gestor das baterias de exames dos pacientes de hemodiálise da Hiperrim — Laboratório Célula Diagnósticos.">
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="css/medrim.css?v=20261022j">
</head>
<body class="bloqueado">
<!-- versão online: login + dados no Firestore (js/nuvem.js). Para testar sem nuvem, troque nuvem:true por false. -->
<script>window.MED = { nuvem: true };</script>
<div id="login" class="login"><div class="login-card"><div class="login-carregando"><span class="spin"></span>Abrindo o MedRim…</div></div></div>
<div class="app">
  <aside class="side" aria-label="Navegação">
    <div class="brand">
      <div class="logos">
        <img src="img/logo-celula.png" alt="Célula Diagnósticos">
        <span class="x" aria-hidden="true">×</span>
        <span class="hip"><img src="img/hiperrim.png" alt="Hiperrim"></span>
      </div>
      <div class="nome"><span>Med<b>Rim</b></span><small>ONLINE</small></div>
    </div>
    <nav id="nav" style="display:contents"></nav>
    <div class="grow"></div>
    <div class="rodape">
      <div class="usuario" id="usuario" hidden></div>
      <button class="nav so-prog" data-acao="importar"><svg class="i"><use href="#i-upload"/></svg>Importar arquivos</button>
      <button class="nav so-prog" data-acao="backup"><svg class="i"><use href="#i-download"/></svg>Backup (JSON)</button>
      <button class="nav" data-acao="tema"><svg class="i"><use href="#i-moon"/></svg><span id="rot-tema">Tema escuro</span></button>
      <button class="nav so-nuvem" data-acao="sair"><svg class="i"><use href="#i-x"/></svg>Sair</button>
    </div>
  </aside>

  <div class="main">
    <header class="top" id="top">
      <div>
        <h1 id="titulo">MedRim</h1>
        <div class="sub" id="subtitulo"></div>
      </div>
      <span id="nuvem-status" class="nuvem-status" hidden aria-live="polite"></span>
      <div class="esp"></div>
      <div class="busca" role="search">
        <svg class="i"><use href="#i-search"/></svg>
        <input id="busca" type="search" placeholder="Buscar paciente, CPF ou máquina…" autocomplete="off" aria-label="Buscar paciente">
        <kbd>/</kbd>
        <div class="resultados" id="resultados" role="listbox"></div>
      </div>
      <label class="sr" for="ref">Bateria de referência</label>
      <select id="ref" class="btn" title="Bateria de referência"></select>
    </header>
    <main class="conteudo" id="conteudo" tabindex="-1"></main>
  </div>
</div>

<div class="veu" id="veu"></div>
<aside class="gaveta" id="gaveta" aria-label="Ficha do paciente" aria-hidden="true"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="arquivos" multiple accept=".docx,.csv,.xlsx" hidden>
<input type="file" id="arq-backup" accept=".json" hidden>

<script>
  // se o login não carregar (sem internet / bloqueio), avisa em vez de girar para sempre
  setTimeout(function () {
    if (window.MED && window.MED.nuvem && !window.MED.nuvemApi) {
      var c = document.querySelector('#login .login-card');
      if (c) c.innerHTML = '<div class="login-aviso"><b>Não consegui abrir o login</b><p>Confira a internet e recarregue a página (Ctrl+F5). Se continuar, o acesso ao Firebase (gstatic.com) pode estar bloqueado nesta rede.</p></div>';
    }
  }, 20000);
</script>
